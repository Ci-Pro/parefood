{
  "$schema": "https://raw.githubusercontent.com/supabase/supabase/main/packages/supabase/supabase.json",
  "auth": {
    "enabled": true,
    "site_url": "http://localhost:3000",
    "additional_redirect_urls": [
      "https://localhost:3000",
      "parefood://",
      "exp://localhost:19000"
    ],
    "jwt_expiry": 3600,
    "refresh_token_reuse_interval": 10
  },
  "api": {
    "enabled": true,
    "port": 54321,
    "schemas": ["public", "graphql_public"],
    "extra_search_path": ["public"],
    "max_rows": 1000
  },
  "db": {
    "port": 54322
  },
  "studio": {
    "enabled": true,
    "port": 54323
  },
  "realtime": {
    "enabled": true
  }
}