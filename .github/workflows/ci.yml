name: CI — PareFood

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx nx run-many --target=lint --all --parallel=3

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx nx run-many --target=typecheck --all --parallel=3

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check SQL syntax in migrations
        run: |
          echo "Checking all SQL migration files for syntax issues..."
          for f in supabase/migrations/*.sql; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              if [ -z "$(grep -i "CREATE TABLE" "$f")" ] && [ -z "$(grep -i "ALTER TABLE" "$f")" ] && [ -z "$(grep -i "CREATE INDEX" "$f")" ] && [ -z "$(grep -i "INSERT INTO" "$f")" ] && [ -z "$(grep -i "CREATE EXTENSION" "$f")" ]; then
                echo "WARNING: No SQL statements found in $f"
              else
                echo "  OK - has SQL statements"
              fi
            fi
          done

  build-backend:
    name: Build Backend (Total.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node apps/backend/index.js --debug &
      - name: Wait for server
        run: sleep 3 && curl -sf http://localhost:8000/health/ || (kill %1 && exit 1)
      - name: Health check passed
        run: echo "Backend health check passed!"

  build-apps:
    name: Build Affected Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer, merchant, driver, admin-mobile, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx nx build ${{ matrix.app }} --parallel=1
        continue-on-error: true
        name: Build ${{ matrix.app }} (may need native deps)